<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamina — MMI x EDF : Projet Vinyle Interactif</title>
  <style>
    /* ==========================================================================
       1. VARIABLES & RESET
       ========================================================================== */
    :root {
      --edf-blue: #001A70;
      --edf-blue-light: #002B9E;
      --edf-orange: #FF5C00;
      --edf-orange-hover: #FF7A29;
      --edf-yellow: #FFB800;
      --bg-dark: #0A0D1A;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-white: #FFFFFF;
      --text-muted: #94A3B8;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 26, 112, 0.6) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 92, 0, 0.25) 0%, transparent 40%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. LAYOUT PRINCIPAL
       ========================================================================== */
    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 40%, var(--edf-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .badge-mmi {
      display: inline-block;
      background: rgba(255, 92, 0, 0.15);
      border: 1px solid var(--edf-orange);
      color: var(--edf-orange);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       3. PLATINE VINYLE & POCHETTE
       ========================================================================== */
    .player-deck {
      position: relative;
      width: 100%;
      max-width: 700px;
      height: 420px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .turntable-wrapper {
      position: relative;
      width: 580px;
      height: 340px;
      display: flex;
      align-items: center;
    }

    /* --- POCHETTE (COVER) --- */
    .sleeve {
      position: absolute;
      left: 20px;
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, var(--edf-blue) 0%, #000D38 100%);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      z-index: 3;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      transition: var(--transition);
    }

    .sleeve-bg-accent {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 180px;
      height: 180px;
      background: var(--edf-orange);
      filter: blur(50px);
      opacity: 0.6;
      border-radius: 50%;
      pointer-events: none;
    }

    .sleeve-header h2 {
      font-size: 1.3rem;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sleeve-header span {
      font-size: 0.75rem;
      color: var(--edf-orange);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sleeve-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .sticker-mmi {
      width: 75px;
      height: 75px;
      background: var(--edf-yellow);
      color: #000;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.65rem;
      text-align: center;
      line-height: 1.1;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transform: rotate(-12deg);
      border: 2px dashed #000;
    }

    .sleeve-credits {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      text-align: right;
      font-weight: 600;
    }

    /* --- DISQUE VINYLE --- */
    .vinyl-container {
      position: absolute;
      left: 40px;
      width: 310px;
      height: 310px;
      z-index: 2;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .player-deck.playing .vinyl-container {
      transform: translateX(180px);
    }

    .vinyl {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #111 0%, #050505 100%);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        inset 0 0 0 15px rgba(255, 255, 255, 0.03),
        inset 0 0 0 35px rgba(255, 255, 255, 0.03),
        inset 0 0 0 55px rgba(255, 255, 255, 0.03),
        inset 0 0 0 75px rgba(255, 255, 255, 0.03);
    }

    .vinyl.spinning {
      animation: rotateVinyl 2s linear infinite;
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .macaron {
      width: 110px;
      height: 110px;
      background: var(--edf-blue);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
    }

    .macaron svg {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotateVinyl 12s linear infinite;
    }

    .macaron svg text {
      fill: #FFFFFF;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .macaron-center-title {
      font-size: 0.55rem;
      font-weight: 900;
      color: var(--edf-orange);
      text-align: center;
      z-index: 2;
    }

    .center-hole {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      z-index: 3;
    }

    /* --- BRAS DE LECTURE --- */
    .tonearm {
      position: absolute;
      right: 40px;
      top: 30px;
      width: 80px;
      height: 260px;
      z-index: 4;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 40px 40px;
      transform: rotate(-30deg);
    }

    .player-deck.playing .tonearm {
      transform: rotate(14deg);
    }

    .tonearm-base {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #444, #111);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      border: 2px solid #666;
    }

    .tonearm-stick {
      position: absolute;
      top: 40px;
      left: 38px;
      width: 6px;
      height: 180px;
      background: linear-gradient(to right, #888, #E0E0E0, #666);
      border-radius: 3px;
    }

    .tonearm-head {
      position: absolute;
      bottom: 30px;
      left: 26px;
      width: 16px;
      height: 30px;
      background: var(--edf-orange);
      border-radius: 3px;
      transform: rotate(15deg);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    /* ==========================================================================
       4. BARRE DE CONTRÔLE & LIEN PORTFOLIO
       ========================================================================== */
    .controls-panel {
      width: 100%;
      max-width: 700px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 1.2rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .time-stamp {
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--text-muted);
      min-width: 40px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--edf-blue-light), var(--edf-orange));
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .btn-play {
      background: var(--edf-orange);
      color: #FFF;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 92, 0, 0.4);
      transition: var(--transition);
    }

    .btn-play:hover {
      background: var(--edf-orange-hover);
      transform: scale(1.05);
    }

    .btn-play svg {
      width: 20px;
      height: 20px;
      fill: #FFF;
    }

    /* Bouton Portfolio (Candidature) */
    .btn-portfolio {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--text-white);
      padding: 0.55rem 1rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
    }

    .btn-portfolio:hover {
      background: var(--edf-blue);
      border-color: var(--edf-blue-light);
      transform: translateY(-2px);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .volume-container svg {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 70px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-white);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- EN-TÊTE PROJET -->
    <header>
      <span class="badge-mmi">Candidature Stage EDF — Projet MMI</span>
      <h1>Les Champs-Élysées (Remix EDF)</h1>
      <p>Conçu et réalisé par <strong>Yamina</strong></p>
    </header>

    <!-- PLATINE VINYLE INTERACTIVE -->
    <div class="player-deck" id="playerDeck">
      <div class="turntable-wrapper">
        
        <!-- Pochette (Cover) -->
        <div class="sleeve">
          <div class="sleeve-bg-accent"></div>
          <div class="sleeve-header">
            <span>Édition Spéciale</span>
            <h2>Les Champs-<br>Élysées</h2>
          </div>
          <div class="sleeve-footer">
            <div class="sticker-mmi">
              100% MMI<br>EDF STAGE
            </div>
            <div class="sleeve-credits">
              Par Yamina<br>MMI 
            </div>
          </div>
        </div>

        <!-- Disque Vinyle -->
        <div class="vinyl-container" id="vinylContainer">
          <div class="vinyl" id="vinylDisk">
            <div class="macaron">
              <svg viewBox="0 0 100 100">
                <path id="textPath" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" fill="none"/>
                <text>
                  <textPath href="#textPath" startOffset="0%">
                    LES CHAMPS-ÉLYSÉES • REMIX YAMINA • EDF 2025 •
                  </textPath>
                </text>
              </svg>
              <div class="macaron-center-title">STAGE<br>EDF</div>
              <div class="center-hole"></div>
            </div>
          </div>
        </div>

        <!-- Bras de lecture -->
        <div class="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearm-stick"></div>
          <div class="tonearm-head"></div>
        </div>

      </div>
    </div>

    <!-- CONTRÔLES AUDIO & PORTFOLIO -->
    <div class="controls-panel">
      
      <!-- Barre de progression -->
      <div class="progress-bar-container">
        <span class="time-stamp" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-stamp" id="duration">0:00</span>
      </div>

      <!-- Boutons de commande -->
      <div class="controls-row">
        
        <!-- Lien vers ton portfolio (Remplace le '#' par ton URL de portfolio) -->
        <div class="controls-left">
          <a href="https://ton-portfolio.fr" target="_blank" class="btn-portfolio">
            🌐 Mon Portfolio
          </a>
        </div>

        <!-- Bouton Play/Pause central -->
        <button class="btn-play" id="playBtn" aria-label="Jouer">
          <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <!-- Volume -->
        <div class="controls-right">
          <div class="volume-container">
            <svg viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- AUDIO ELEMENT (Ton fichier MP3 REAPER renommé) -->
  <audio id="audioPlayer" src="Champs-Élysées Remix Yamina.mp3" preload="metadata"></audio>

  <!-- JAVASCRIPT -->
  <script>
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playerDeck = document.getElementById('playerDeck');
    const vinylDisk = document.getElementById('vinylDisk');
    const vinylContainer = document.getElementById('vinylContainer');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');

    let isPlaying = false;
    const svgPlay = '<path d="M8 5v14l11-7z"/>';
    const svgPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      audioPlayer.play().then(() => {
        isPlaying = true;
        playIcon.innerHTML = svgPause;
        playerDeck.classList.add('playing');
        vinylDisk.classList.add('spinning');
      }).catch(err => {
        console.log("Erreur lecture audio :", err);
        alert("Vérifie que ton fichier 'champs-elysees-remix-yamina.mp3' est bien placé dans le même dossier que ce fichier HTML !");
      });
    }

    function pauseAudio() {
      audioPlayer.pause();
      isPlaying = false;
      playIcon.innerHTML = svgPlay;
      playerDeck.classList.remove('playing');
      vinylDisk.classList.remove('spinning');
    }

    playBtn.addEventListener('click', togglePlay);
    vinylContainer.addEventListener('click', togglePlay);

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
      }
    });

    audioPlayer.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audioPlayer.duration);
    });

    audioPlayer.addEventListener('ended', () => {
      pauseAudio();
      progressFill.style.width = '0%';
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      audioPlayer.volume = e.target.value;
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
</body>
</html>
